version: "3"

tasks:
  init:
    cmd: mise exec go -- go mod download
  build:
    desc: Build bin/tell
    cmds:
      - mkdir -p bin
      - mise exec go -- go build -o bin/tell ./cmd/tell
  package:
    desc: Build and verify four release archives (VERSION=vX.Y.Z)
    cmd: mise exec go -- sh scripts/package.sh
  run:
    desc: Run tell from source
    cmd: mise exec go -- go run ./cmd/tell {{.CLI_ARGS}}
  fix:
    cmd: find cmd internal integration -type f -name '*.go' -exec mise exec go -- gofmt -w {} +
  check:
    cmds:
      - test -z "$(find cmd internal integration -type f -name '*.go' -exec mise exec go -- gofmt -l {} +)"
      - mise exec go -- go vet ./...
      - mise exec staticcheck -- staticcheck ./...
  test:
    cmd: mise exec go -- go test ./... {{.CLI_ARGS}}
