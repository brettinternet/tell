# Install as ~/.config/tell/config.yaml (or under XDG_CONFIG_HOME).
# notify writes to stderr by default; select desktop for native macOS/Linux banners,
# or apprise to use optional external Apprise. Desktop setup: docs/design.md#desktop-delivery.
# Provider acceptance is not human acknowledgment.
version: 1
notify:
  via: stderr
apprise:
  config: ../apprise/apprise.yaml
# Built-in alternative to Apprise; the variable holds the Shoutrrr URLs.
# shoutrrr:
#   urls_env: SHOUTRRR_URLS
# Direct Pushover; the variables hold the app token and user key.
# pushover:
#   token_env: PUSHOVER_TOKEN
#   user_env: PUSHOVER_USER
# macOS Messages; one E.164 number or Apple ID email.
# imessage:
#   to: "+15551234567"
herdr:
  session: main
